const middle=(id,values,fallback)=>ix(id)>=0?values[ix(id)]??fallback:fallback;
function estimates(){const h=REF.assumptions;const v=REF.vehicles.consommations;const trip=middle('distance',[5,15,30,50,75],15)*2*middle('days',[.5,1,2,3,4,5],3)*46;const professional=middle('proKm',[0,2500,7500,15000,25000,35000],7500);const personal=middle('privateKm',[1250,3750,7500,12500,17500],7500);
return {trip,professional,personal,kms:trip+personal,years:middle('years',[2,3.5,5.5,7.5,10],5.5),purchase:middle('budget',[12000,20000,30000,40000,50000],20000),homeShare:answers.home==='Impossible'?0:middle('homeShare',[0,.125,.375,.63,.85,.4],.4),homePrice:middle('homePrice',[.18,.25,.35,.44,.25],.25),publicPaidShare:answers.home==='Impossible'?1:middle('publicPaidShare',[0,.25,.5,.75,1,.5],0),publicPrice:answers.home==='Impossible'?REF.assumptions.prix.kwhPublic:middle('publicPrice',[.25,.38,.53,.7,REF.assumptions.prix.kwhPublic],REF.assumptions.prix.kwhPublic),install:answers.home==='Installation nécessaire'?middle('install',[350,750,1250,1750,2500,1000],1000):0,insurance:h.frais.assuranceAnnuelle,maintenance:h.frais.entretienAnnuel,resale:null,dieselPrice:h.prix.diesel,petrolPrice:h.prix.essence,electricPublic:h.prix.kwhPublic,annualFixed:h.frais.autresAnnuels,consumptionDiesel:v.Diesel.litresDiesel100,consumptionPetrol:v.Essence.litresEssence100,consumptionHybrid:v.Hybride.litresEssence100,consumptionPhevPetrol:v['Hybride rechargeable'].litresEssence100,consumptionPhevElectric:v['Hybride rechargeable'].kwh100,consumptionElectric:v['Électrique'].kwh100,tax:middle('tax',[0,.11,.3,.41,.45,.3],.3),social:h.fiscalite.cotisationsSalarialesEstimees,socialDeductibleShare:h.fiscalite.partDeductibleEstimee};}
// Hypothèse fiscale de recette volontairement paramétrable.
// La TMI et le taux de charges ne constituent pas un calcul de paie.
// 'socialDeductibleShare' représente une part estimée déductible de l'assiette fiscale.
function netImpact(gross,e){
  const social=gross*e.social;
  const taxableBase=Math.max(0,gross-social*e.socialDeductibleShare);
  const tax=taxableBase*e.tax;
  return {gross,social,tax,taxableBase,cost:social+tax,net:gross-social-tax};
}
function calculate(e){
  // Moteur de recette : les montants fiscaux/AEN et la grille de compensation restent fictifs.
  // Les kilomètres de missions sont intégralement pris en charge par SUEZ et exclus des frais du salarié.
  const aen1=middle('aen',REF.aen.montants,REF.aen.montants[0])*12;
  const aen2=middle('aenFuture',REF.aen.montants,REF.aen.montants[0])*12;
  const compGross=middle('comp',REF.comp.montants,REF.comp.montants[0])*12;
  const compImpact=netImpact(compGross,e); // Hypothèse de recette, non validée fiscalement.
  const compNet=compImpact.net;
  if(!Number.isFinite(e.years)||e.years<=0)throw Error('Durée de détention invalide.');
  if(!Number.isFinite(e.homeShare)||e.homeShare<0||e.homeShare>1)throw Error('La part de recharge à domicile doit être comprise entre 0 et 100 %.');
  const publicPaidShare=answers.home==='Impossible'?1:(e.publicPaidShare??0);
  const publicPrice=e.publicPrice??e.electricPublic;
  if(!Number.isFinite(publicPaidShare)||publicPaidShare<0||publicPaidShare>1||!Number.isFinite(publicPrice)||publicPrice<0)throw Error('Part ou prix des recharges publiques à votre charge invalide.');
  const currentAenImpact=netImpact(aen1,e);
  const futureAenImpact=netImpact(aen2,e);
  const energy=(motor,km,context='personal')=>{
    // Pour le véhicule de fonction électrique : recharges domicile + bornes publiques payantes à sa charge.
// Recharges sur bornes ou cartes effectivement prises en charge par SUEZ : coût salarié nul.
    // Pour un véhicule personnel : toutes les charges (domicile et public) sont à sa charge.
    const electricRate=context==='futureCompany'
      ? e.homeShare*e.homePrice+(1-e.homeShare)*publicPaidShare*publicPrice
      : e.homeShare*e.homePrice+(1-e.homeShare)*e.electricPublic;
    if(motor==='Électrique')return km*e.consumptionElectric/100*electricRate;
    if(motor==='Hybride rechargeable')return km*(e.consumptionPhevPetrol/100*e.petrolPrice+e.consumptionPhevElectric/100*electricRate);
    if(motor==='Hybride'||motor==='Hybride (dérogation)')return km*e.consumptionHybrid/100*e.petrolPrice;
    if(motor==='Essence')return km*e.consumptionPetrol/100*e.petrolPrice;
    return km*e.consumptionDiesel/100*e.dieselPrice;
  };
  const share=(value)=>value==='SUEZ'?0:value==='Salarié'?1:.5; // 'Partagé' : hypothèse 50 %, modifiable ultérieurement.
  const oldCommute=energy(answers.motor,e.trip)*share(answers.commutePayer);
  const oldPrivate=energy(answers.motor,e.personal)*share(answers.privatePayer);
  // Par convention de recette, le salarié finance ses kilomètres domicile-travail et privés futurs.
  const newCommute=energy(answers.futureMotor,e.trip,'futureCompany');
  const newPrivate=energy(answers.futureMotor,e.personal,'futureCompany');
  const futureInstall=answers.futureMotor==='Électrique'&&answers.home==='Installation nécessaire'&&answers.subsidy!=='Oui totalement'?e.install/e.years:0;
  const resale=e.resale==null?e.purchase*REF.assumptions.revente.fractionPrixAchat:e.resale;
  const depreciation=(e.purchase-resale)/e.years;
  const privateInstall=answers.persMotor==='Électrique'&&answers.home==='Installation nécessaire'?e.install/e.years:0;
  const personalCommute=energy(answers.persMotor,e.trip);
  const personalPrivate=energy(answers.persMotor,e.personal);
  const breakdowns=[
    {aenSocial:currentAenImpact.social,aenTax:currentAenImpact.tax,commute:oldCommute,privateEnergy:oldPrivate},
    {aenSocial:futureAenImpact.social,aenTax:futureAenImpact.tax,commute:newCommute,privateEnergy:newPrivate,installation:futureInstall},
    {depreciation,insurance:e.insurance,maintenance:e.maintenance,other:e.annualFixed,commute:personalCommute,privateEnergy:personalPrivate,installation:privateInstall,compensation:-compNet}
  ];
  const labels=['Situation actuelle','Demain avec une voiture de fonction','Demain sans voiture de fonction'];
  const annual=breakdowns.map(items=>Object.values(items).reduce((a,b)=>a+b,0));
  return annual.map((cost,i)=>({id:i,label:labels[i],cost,gain:annual[0]-cost,breakdown:breakdowns[i]}));
}
// Calendrier monétaire : le prix d'achat et l'installation sont décaissés au départ,
// la revente est encaissée une seule fois à l'échéance. Aucune dépréciation n'est
// enregistrée dans les flux, car elle est purement économique et non monétaire.
function cashflowSchedule(e,results){
  if(!Number.isFinite(e.years)||e.years<=0||e.years>40)throw Error('Horizon de simulation invalide.');
  const horizon=e.years;
  const purchase=e.purchase;
  const resale=e.resale==null?purchase*REF.assumptions.revente.fractionPrixAchat:e.resale;
  const rows=[];
  const cumulative=[0,0,0];
  const annualOperating=results.map(s=>Object.entries(s.breakdown)
     .filter(([key])=>key!=='depreciation'&&key!=='installation')
     .reduce((total,[,value])=>total+value,0));
  const upfront=[
    0,
    (results[1].breakdown.installation||0)*horizon,
    purchase+(results[2].breakdown.installation||0)*horizon
  ];
  for(let start=0;start<horizon-1e-9;start+=1){
    const duration=Math.min(1,horizon-start);
    const end=start+duration;
    const first=start===0;
    const last=end>=horizon-1e-9;
    const items=annualOperating.map((operating,i)=>{
      const oneOff=first?upfront[i]:0;
      const sale=last&&i===2?resale:0;
      const outgoing=operating*duration+oneOff-sale;
      cumulative[i]+=outgoing;
      return {operating:operating*duration,oneOff,sale,outgoing,cumulative:cumulative[i]};
    });
    rows.push({start,end,duration,items});
  }
  const expected=results.map(x=>x.cost*horizon);
  const discrepancy=cumulative.map((value,i)=>value-expected[i]);
  if(discrepancy.some(x=>Math.abs(x)>0.01))throw Error('Déséquilibre trésorerie / coût économique : vérifier amortissement et revente.');
  return {horizon,purchase,resale,rows,final:[...cumulative],expected,discrepancy};
}

 return '<h2>Trésorerie réelle et coût économique</h2>'+

const STORAGE_KEY='s3e-simulations-v2';
const LEGACY_KEY='s3e-mobile-test';
const MAX_SAVES=20;
function snapshot(){
 return {answers:{...answers},step,view,base:base?{...base}:null,detail:{...detail},last:last?JSON.parse(JSON.stringify(last)):null};
}
function validSnapshot(x){
 if(!x||typeof x!=='object'||Array.isArray(x)||!x.answers||typeof x.answers!=='object'||Array.isArray(x.answers)||!['home','wizard','recap','report','refine','refined'].includes(x.view))return false;
 if(!Number.isInteger(x.step)||x.step<0||x.step>qs.length)return false;
 if(!x.detail||typeof x.detail!=='object'||Array.isArray(x.detail))return false;
 if(['report','refine','refined'].includes(x.view)&&(!x.base||typeof x.base!=='object'||!Number.isFinite(x.base.years)||x.base.years<=0))return false;
 if(x.view==='refined'&&(!Array.isArray(x.last)||x.last.length!==3))return false;
 if(Object.values(x.answers).some(v=>typeof v!=='string'||v.length>150))return false;
 if(Object.values(x.detail).some(v=>typeof v!=='number'||!Number.isFinite(v)))return false;
 return true;
}
function readSaves(){
 const raw=localStorage.getItem(STORAGE_KEY);
 if(!raw)return [];
 const parsed=JSON.parse(raw);
 if(!parsed||parsed.schemaVersion!==2||!Array.isArray(parsed.items)||parsed.items.length>MAX_SAVES)throw Error('Format de sauvegardes non reconnu.');
 if(parsed.items.some(x=>!x||typeof x.id!=='string'||!Number.isFinite(x.savedAt)||typeof x.title!=='string'||x.title.length>100||!validSnapshot(x.data)))throw Error('Une sauvegarde est endommagée.');
 return parsed.items;
}
function storeSaves(items){localStorage.setItem(STORAGE_KEY,JSON.stringify({schemaVersion:2,items}));}
function migrateLegacy(){
 if(localStorage.getItem(STORAGE_KEY)!==null)return;
 const legacy=localStorage.getItem(LEGACY_KEY);
 if(!legacy)return;
 const old=JSON.parse(legacy);
 if(!validSnapshot(old))throw Error('Ancienne sauvegarde non compatible : aucune donnée effacée.');
 storeSaves([{id:'legacy',title:'Ancienne simulation',savedAt:Date.now(),data:old}]);
 // Conserver l'ancienne clé pour permettre un retour arrière.
}
function save(){
 try{
  migrateLegacy();
  const items=readSaves();
  if(items.length>=MAX_SAVES){alert('Limite de '+MAX_SAVES+' simulations atteinte. Supprimez une ancienne sauvegarde.');return;}
  const suggested='Simulation '+(items.length+1);
  const name=prompt('Nom de cette simulation :',suggested);
  if(name===null)return;
  const title=name.trim();
  if(!title||title.length>100){alert('Nom requis (100 caractères maximum).');return;}
  const data=snapshot();
  if(!validSnapshot(data))throw Error('La simulation actuelle ne peut pas être enregistrée.');
  items.unshift({id:'s'+Date.now()+'-'+(items.length+1),title,savedAt:Date.now(),data});
  storeSaves(items);
  alert('Simulation « '+title+' » enregistrée sur cet appareil.');
 }catch(error){alert('Sauvegarde impossible : '+error.message);}
}

function restoreSave(id){
 try{
  const item=readSaves().find(x=>x.id===id);
  if(!item||!validSnapshot(item.data))throw Error('Simulation introuvable ou invalide.');
  const x=JSON.parse(JSON.stringify(item.data));
  ({answers,step,view,base,detail,last}=x);
  // Les résultats d'une sauvegarde peuvent dater d'une ancienne règle métier.
  // Toujours recalculer les bilans selon le moteur actuel avant de les afficher.
  if(base&&['report','refine','refined'].includes(view)){
    calculate(base);
    if(view==='refined'){
      const refined={...base,...detail};
      last=calculate(refined);
      cashflowSchedule(refined,last);
    }
  }
  refineDraft=null;
  if(view==='refine')view='report';
  draw();
 }catch(error){alert('Reprise impossible : '+error.message);}
}
function removeSave(id){

  const items=readSaves(),item=items.find(x=>x.id===id);
  if(!item)return;
  if(!confirm('Supprimer définitivement « '+item.title+' » de cet appareil ?'))return;

 const items=readSaves();
 return '<article><h1>Mes simulations sauvegardées</h1><p class="muted">Les données restent sur ce navigateur. Elles peuvent disparaître si vous effacez ses données ou changez d’appareil.</p>'+
 (items.length?items.map(item=>'<div class="save-entry"><strong>'+escapeHtml(item.title)+'</strong><small class="muted">Enregistrée le '+new Date(item.savedAt).toLocaleString('fr-FR')+'</small><div class="buttons"><button onclick="restoreSave(\''+item.id+'\')">Reprendre</button><button class="secondary" onclick="removeSave(\''+item.id+'\')">Supprimer</button></div></div>').join(''):'<p>Aucune simulation sauvegardée.</p>')+
 '<div class="buttons"><button class="secondary" onclick="view=\'home\';draw()">Retour à l’accueil</button></div></article>';
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
// Export autonome CSV UTF-8 : le séparateur reste « ; » pour Excel FR.
function csvCell(value){
 if(typeof value==='number'&&Number.isFinite(value))return String(value);
 let raw=String(value??'').replaceAll('\r',' ').replaceAll('\n',' ');
 if(/^[=+@\t\r-]/.test(raw)&&!/^-[0-9]+(?:\.[0-9]+)?$/.test(raw))raw="'"+raw;
 return '"'+raw.replaceAll('"','""')+'"';
}
function csvRows(){
 if(!base||!['report','refined'].includes(view))throw Error('Aucun bilan à exporter.');
 const initial=calculate(base);
 const refined=view==='refined'?calculate({...base,...detail}):null;
 const rows=[['section','champ','scenario','valeur','unite'],
  ['information','statut','', 'FICTIF — AEN, compensation, fiscalité et tarifs de test',''],
  ['information','version référentiel AEN','',REF.aen.version,''],
  ['information','version référentiel véhicules','',REF.vehicles.version,'']];
 for(const [key,value] of Object.entries(answers))rows.push(['questionnaire',key,'',value,'']);
 const assumptions=view==='refined'?{...base,...detail}:base;
 for(const [key,value] of Object.entries(assumptions))if(value!==null&&value!==undefined)rows.push(['hypothese',key,'',value,'']);
 for(const [stage,data] of [['premier_bilan',initial],['bilan_affine',refined]]){
  if(!data)continue;
  for(const item of data){
   rows.push([stage,'cout_economique_annuel',item.label,item.cost,'EUR/an']);
   rows.push([stage,'gain_pouvoir_achat_annuel',item.label,item.gain,'EUR/an']);
   for(const [key,amount] of Object.entries(item.breakdown))rows.push([stage,key,item.label,amount,'EUR/an']);
  }
 }
 if(refined)for(const item of compareBilans(initial,refined)){
  rows.push(['comparaison','variation_cout_annuelle',item.label,item.annualCostDelta,'EUR/an']);
  rows.push(['comparaison','variation_cout_mensuelle',item.label,item.monthlyCostDelta,'EUR/mois']);
  rows.push(['comparaison','variation_pouvoir_achat_annuelle',item.label,item.annualGainDelta,'EUR/an']);
 }
 return rows;
}
function csvContent(){return '\ufeff'+csvRows().map(row=>row.map(csvCell).join(';')).join('\r\n')+'\r\n';}
function downloadText(content,filename,mimetype){
 const url=URL.createObjectURL(new Blob([content],{type:mimetype}));
 const link=document.createElement('a');
 link.href=url;link.download=filename;link.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCSV(){
 try{downloadText(csvContent(),'S3E_TEST_bilan_detail.csv','text/csv;charset=utf-8');}
 catch(error){alert('Export CSV impossible : '+error.message);}
}
const PORTABLE_FORMAT='S3E_SIMULATION';
function portablePayload(title='Simulation S3E'){
 const data=snapshot();
 if(!validSnapshot(data))throw Error('La simulation actuelle n’est pas enregistrable.');
 return {format:PORTABLE_FORMAT,schemaVersion:2,exportedAt:new Date().toISOString(),title,referentiels:{
   aen:REF.aen.version,compensation:REF.comp.version,vehicules:REF.vehicles.version,hypotheses:REF.assumptions.version
 },data};
}
function parsePortableJSON(raw){
 if(typeof raw!=='string'||raw.length>1000000)throw Error('Le fichier est vide ou trop volumineux.');
 const parsed=JSON.parse(raw);
 if(!parsed||parsed.format!==PORTABLE_FORMAT||parsed.schemaVersion!==2)throw Error('Format ou version JSON non reconnu.');
 if(typeof parsed.title!=='string'||!parsed.title.trim()||parsed.title.length>100||!validSnapshot(parsed.data))throw Error('Simulation JSON invalide.');
 if(!parsed.referentiels||typeof parsed.referentiels!=='object')throw Error('Versions de référentiels manquantes.');
 return parsed;
}
function exportJSON(){
 try{
  const suggested='Simulation S3E';
  const name=prompt('Nom de la simulation à exporter :',suggested);
  if(name===null)return;
  if(!name.trim()||name.length>100)throw Error('Nom invalide.');
  downloadText(JSON.stringify(portablePayload(name.trim()),null,2),'S3E_TEST_simulation.json','application/json;charset=utf-8');
 }catch(error){alert('Export JSON impossible : '+error.message);}
}
function importPortableJSON(raw){
 const parsed=parsePortableJSON(raw);
 migrateLegacy();
 const items=readSaves();
 if(items.length>=MAX_SAVES)throw Error('Limite des sauvegardes atteinte.');
 // Pas de modification de la simulation active lors de l'import.
 items.unshift({id:'import-'+Date.now()+'-'+(items.length+1),title:parsed.title,savedAt:Date.now(),data:parsed.data});
 storeSaves(items);
 return parsed.title;
}
function chooseImportJSON(){
 const input=document.createElement('input');
 input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{
  const file=input.files&&input.files[0];
  if(!file)return;
  if(file.size>1000000){alert('Fichier JSON trop volumineux.');return;}
  try{
   const raw=await file.text();
   const parsed=parsePortableJSON(raw);
   if(!confirm('Importer « '+parsed.title+' » dans les sauvegardes de cet appareil ?'))return;
   const title=importPortableJSON(raw);
   alert('Simulation « '+title+' » importée. Ouvrez les sauvegardes pour la reprendre.');
  }catch(error){alert('Import impossible : '+error.message);}
 };
 input.click();
}

draw();
