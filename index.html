<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulateur S3E · Recette mobile</title>
<style>
:root{font-family:system-ui,-apple-system,Arial;color:#14243a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#063b66;color:#fff;padding:18px}header strong{font-size:21px}header small{display:block;color:#dbeafe}main{max-width:850px;margin:auto;padding:16px}article{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:20px;margin:13px 0;box-shadow:0 2px 8px #0001}h1{font-size:24px}h2{font-size:19px}p{line-height:1.5}.warn{background:#fff5d8;padding:12px;border-radius:9px}.scenario-intro{background:#eaf4fe;border-left:4px solid #07599b;padding:14px;border-radius:10px;margin:18px 0}.scenario-intro p{font-size:14px;margin:9px 0 0}.label{font-weight:650}label.opt{display:flex;gap:12px;align-items:center;border:1px solid #d2d9e5;border-radius:10px;padding:13px;margin:9px 0}input[type=radio]{width:20px;height:20px}button{background:#07599b;color:#fff;border:0;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:600;cursor:pointer}button.secondary{background:#e8f0f8;color:#123b60}button:disabled{opacity:.45}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.progress{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#0879c3}.muted{color:#5d6c7b;font-size:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.card{background:#f0f7ff;padding:12px;border-radius:10px}.card b{display:block;font-size:20px;margin:6px 0}.positive{color:#087545}.negative{color:#b3261e}table{border-collapse:collapse;width:100%;font-size:13px}.barrow{display:grid;grid-template-columns:minmax(100px,1fr) 2fr auto;gap:8px;align-items:center;margin:11px 0;font-size:13px}.track{height:15px;border-radius:12px;background:#edf1f6;overflow:hidden}.fill{height:100%;background:#1976ae;border-radius:12px}.fill.neg{background:#b45b57}.chartnote{font-size:12px;color:#637084}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}th:first-child,td:first-child{text-align:left}input[type=number]{padding:10px;width:100%;font-size:16px;border:1px solid #ccd7e4;border-radius:9px}.field{display:block;margin:12px 0}footer{padding:22px;text-align:center;color:#6c7480;font-size:13px}@media print{header,.buttons,.warn{display:none!important}article{break-inside:avoid;box-shadow:none}}
</style></head>
<body><header><strong>S3E · Simulateur véhicules</strong><small>Recette mobile — démonstration avec données fictives</small></header><main id="root"></main><footer>Prototype de test. Aucune donnée transmise à SUEZ ou au S3E. Les calculs ne constituent pas une simulation fiscale validée.</footer>
<script>
const root=document.getElementById('root');
const fmt=x=>Math.round(x).toLocaleString('fr-FR')+' €';
const qs=[
['motor','Motorisation actuelle',['Diesel','Essence','Hybride','Électrique']],
['km','Kilométrage annuel',['Moins de 10 000','10 000 à 20 000','Plus de 20 000']],
['commutePayer','Carburant domicile-travail actuellement',['SUEZ','Salarié','Partagé']],
['privatePayer','Carburant privé actuellement',['SUEZ','Salarié','Partagé']],
['aen','AEN actuel — montants fictifs de TEST',['100 €/mois','200 €/mois','300 €/mois','400 €/mois']],
['distance','Distance domicile-travail aller',['Moins de 10 km','10 à 20 km','21 à 40 km','41 à 60 km','Plus de 60 km']],
['days','Jours de trajet hebdomadaire',['Moins de 1','1','2','3','4','5 ou plus']],
['proKm','Kilomètres professionnels annuels hors trajets domicile-travail',['Aucun','Moins de 5 000','5 000 à 10 000','10 001 à 20 000','20 001 à 30 000','Plus de 30 000']],
['privateKm','Kilomètres privés annuels hors trajets domicile-travail',['Moins de 2 500','2 500 à 5 000','5 001 à 10 000','10 001 à 15 000','Plus de 15 000']],
['total','Carte Total pour déplacements privés',['Utilisable en semaine seulement','Week-ends et vacances inclus','Pas d’usage privé','Autre']],
['futureMotor','Motorisation future SUEZ',['Électrique','Diesel (dérogation)','Hybride (dérogation)']],
['home','Recharge possible à domicile',['Déjà installée','Installation nécessaire','Impossible','Je ne sais pas']],
['install','Coût d’installation prévu',['Moins de 500 €','500 à 1 000 €','1 001 à 1 500 €','1 501 à 2 000 €','Plus de 2 000 €','Je ne sais pas']],
['homeShare','Part de recharge au domicile',['0 %','Moins de 25 %','25 à 50 %','51 à 75 %','Plus de 75 %','Je ne sais pas']],
['homePrice','Tarif électrique domicile',['Moins de 0,20 €/kWh','0,20 à 0,30 €/kWh','0,31 à 0,40 €/kWh','Plus de 0,40 €/kWh','Je ne sais pas']],
['energyCard','Carte énergie future',['Oui','Non']],
['aenFuture','AEN futur SUEZ — valeurs fictives',['100 €/mois','200 €/mois','300 €/mois','400 €/mois']],
['tax','Tranche marginale d’imposition',['0 %','11 %','30 %','41 %','45 %','Je ne sais pas']],
['subsidy','SUEZ prend-il en charge l’installation ?',['Non','Oui totalement','Oui partiellement','Je ne sais pas']],
['budget','Budget d’achat du véhicule personnel',['Moins de 15 000 €','15 000 à 25 000 €','25 001 à 35 000 €','35 001 à 45 000 €','Plus de 45 000 €','Je ne sais pas']],
['years','Durée de détention du véhicule personnel',['Moins de 3 ans','3 à 4 ans','5 à 6 ans','7 à 8 ans','Plus de 8 ans','Je ne sais pas']],
['persMotor','Motorisation du véhicule personnel',['Diesel','Essence','Hybride','Hybride rechargeable','Électrique','Je ne sais pas']],
['comp','Compensation SUEZ — valeurs fictives',['0 €/mois','150 €/mois','300 €/mois','450 €/mois']]
].map(([id,title,options])=>({id,title,options}));

const uxCopy={"motor":["Votre véhicule SUEZ actuel","Quelle est la motorisation du véhicule de fonction SUEZ que vous utilisez aujourd’hui ?","Répondez pour votre voiture actuelle, pas pour celle du prochain renouvellement."],"km":["Votre véhicule SUEZ actuel","Environ combien de kilomètres parcourez-vous par an, tous déplacements confondus ?","Il s’agit de votre kilométrage annuel global, utilisé pour situer votre profil. Les trajets seront détaillés ensuite."],"commutePayer":["Votre véhicule SUEZ actuel","Aujourd’hui, qui paie l’énergie des trajets entre votre domicile et votre travail ?","Uniquement vos allers-retours domicile–travail. N’incluez pas les déplacements professionnels en mission."],"privatePayer":["Votre véhicule SUEZ actuel","Aujourd’hui, qui paie l’énergie de vos déplacements personnels avec le véhicule SUEZ ?","Exemples : loisirs, courses, vacances. Hors trajets domicile–travail et missions."],"aen":["Votre véhicule SUEZ actuel","Quel est le montant mensuel de l’avantage en nature (AEN) de votre véhicule SUEZ actuel ?","Choisissez le montant figurant sur votre paie ou dans la grille SUEZ. Les choix de cette version sont fictifs."],"distance":["Vos déplacements","Combien de kilomètres compte votre trajet simple entre votre domicile et votre travail ?","Indiquez l’aller uniquement : le simulateur calcule l’aller-retour."],"days":["Vos déplacements","En moyenne, combien de jours par semaine allez-vous travailler en voiture ?","Tenez compte du télétravail et des journées sans déplacement domicile–travail."],"proKm":["Vos déplacements","Combien de kilomètres faites-vous par an pour vos missions professionnelles ?","Excluez les allers-retours domicile–travail et les déplacements privés."],"privateKm":["Vos déplacements","Combien de kilomètres faites-vous par an pour vos déplacements privés ?","Exemples : courses, loisirs et vacances ; sans trajets domicile–travail."],"total":["Votre véhicule SUEZ actuel","Quelles utilisations privées votre carte carburant Total permet-elle aujourd’hui ?","Distinguez les pleins en semaine, le week-end et pendant les vacances, selon les règles qui s’appliquent à vous."],"futureMotor":["Votre futur véhicule SUEZ","Quelle sera la motorisation de votre prochain véhicule de fonction SUEZ ?","Le scénario standard est électrique. Les autres motorisations correspondent à une éventuelle dérogation."],"home":["Recharge de votre futur véhicule SUEZ","Pourriez-vous recharger votre futur véhicule électrique à votre domicile ?","Ne tenez compte que de votre domicile, et non des bornes sur le lieu de travail."],"install":["Recharge de votre futur véhicule SUEZ","Quel serait le coût approximatif pour installer une recharge chez vous ?","Incluez pose et raccordement, avant toute aide éventuelle de SUEZ."],"homeShare":["Recharge de votre futur véhicule SUEZ","Quelle part de la recharge du futur véhicule de fonction SUEZ effectueriez-vous à domicile, à vos frais ?","Seule la recharge payée par vous à domicile est comptée. La recharge avec une borne ou carte énergie SUEZ est sans coût pour vous."],"homePrice":["Recharge de votre futur véhicule SUEZ","Quel est votre prix approximatif du kWh d’électricité à domicile ?","Utilisez votre prix TTC du kWh, hors abonnement fixe."],"energyCard":["Votre futur véhicule SUEZ","Disposerez-vous d’une carte énergie professionnelle pour le futur véhicule SUEZ ?","Elle concerne les missions professionnelles, pas automatiquement les trajets domicile–travail."],"aenFuture":["Votre futur véhicule SUEZ","Quel serait l’avantage en nature (AEN) mensuel de votre futur véhicule SUEZ ?","Utilisez la grille AEN SUEZ. Les montants disponibles ici sont fictifs pour les tests."],"tax":["Votre situation fiscale","Quelle est votre tranche marginale d’imposition (TMI) sur le revenu ?","La TMI n’est pas votre taux de prélèvement à la source ni votre taux moyen d’imposition."],"subsidy":["Recharge de votre futur véhicule SUEZ","SUEZ prendra-t-il en charge l’installation de votre recharge à domicile ?","Cette question concerne l’installation, pas les consommations électriques ultérieures."],"budget":["Votre véhicule personnel","Si vous rendiez votre voiture de fonction SUEZ pour utiliser votre propre véhicule, quel budget prévoiriez-vous pour acheter cette voiture ?","Imaginez que vous n’ayez plus de véhicule de fonction : vous achetez une voiture neuve ou d’occasion à vos frais. Indiquez le prix estimé avant toute revente."],"years":["Votre véhicule personnel","Si vous rendiez votre véhicule de fonction et achetiez votre propre voiture, pendant combien d’années la conserveriez-vous ?","Pensez à la voiture que vous achèteriez vous-même. Cette durée permet de calculer sa perte de valeur annuelle et de comparer les scénarios."],"persMotor":["Votre véhicule personnel","Si vous remplaciez votre voiture de fonction SUEZ par une voiture achetée personnellement, quelle motorisation choisiriez-vous ?","Répondez pour la voiture que vous financeriez vous-même, et non pour le prochain véhicule que SUEZ pourrait mettre à votre disposition."],"comp":["Votre véhicule personnel","Si vous rendiez votre véhicule de fonction SUEZ pour utiliser votre propre voiture, quelle compensation serait prévue ?","Cette compensation suppose que vous n’utilisez plus la voiture de fonction. Choisissez dans la grille SUEZ (ici fictive), et non le montant que vous souhaiteriez négocier."]};
let answers={},step=0,view='home',base=null,detail={},last=null;
const $=(id)=>document.getElementById(id);
function selected(id){return answers[id]??null}function ix(id){return qs.find(q=>q.id===id).options.indexOf(selected(id))}
function active(){return qs.filter(q=>{if(['home','install','homeShare','homePrice','energyCard','subsidy'].includes(q.id)&&answers.futureMotor!=='Électrique')return false;if(['install','subsidy'].includes(q.id)&&answers.home!=='Installation nécessaire')return false;if(q.id==='homeShare'&&answers.home==='Impossible')return false;if(q.id==='homePrice'&&(answers.home==='Impossible'||answers.homeShare==='0 %'))return false;return true})}
const middle=(id,values,fallback)=>ix(id)>=0?values[ix(id)]??fallback:fallback;
function estimates(){const trip=middle('distance',[5,15,30,50,75],15)*2*middle('days',[.5,1,2,3,4,5],3)*46;const professional=middle('proKm',[0,2500,7500,15000,25000,35000],7500);const personal=middle('privateKm',[1250,3750,7500,12500,17500],7500);
return {trip,professional,personal,kms:trip+personal,years:middle('years',[2,3.5,5.5,7.5,10],5.5),purchase:middle('budget',[12000,20000,30000,40000,50000],20000),homeShare:answers.home==='Impossible'?0:middle('homeShare',[0,.125,.375,.63,.85,.4],.4),homePrice:middle('homePrice',[.18,.25,.35,.44,.25],.25),install:answers.home==='Installation nécessaire'?middle('install',[350,750,1250,1750,2500,1000],1000):0,insurance:700,maintenance:800,resale:null,dieselPrice:1.75,petrolPrice:1.85,electricPublic:.5,annualFixed:0,consumptionDiesel:6,consumptionPetrol:7,consumptionHybrid:5,consumptionPhevPetrol:3.5,consumptionPhevElectric:8,consumptionElectric:20,tax:middle('tax',[0,.11,.3,.41,.45,.3],.3),social:.22};}
function calculate(e){
  // Moteur de recette : les montants fiscaux/AEN et la grille de compensation restent fictifs.
  // Les kilomètres de missions sont intégralement pris en charge par SUEZ et exclus des frais du salarié.
  const aen1=middle('aen',[100,200,300,400],200)*12;
  const aen2=middle('aenFuture',[100,200,300,400],200)*12;
  const compGross=middle('comp',[0,150,300,450],150)*12;
  const compNet=compGross*(1-e.social)*(1-e.tax); // Hypothèse de recette, non validée fiscalement.
  if(!Number.isFinite(e.years)||e.years<=0)throw Error('Durée de détention invalide.');
  if(!Number.isFinite(e.homeShare)||e.homeShare<0||e.homeShare>1)throw Error('La part de recharge à domicile doit être comprise entre 0 et 100 %.');
  const taxable=(amount)=>amount*(e.social+e.tax); // Approximation pédagogique, ne pas diffuser comme calcul officiel.
  const energy=(motor,km,context='personal')=>{
    // Pour le véhicule de fonction électrique : seul le domicile reste payé par le salarié.
    // Pour un véhicule personnel : toutes les charges (domicile et public) sont à sa charge.
    const electricRate=context==='futureCompany'
      ? e.homeShare*e.homePrice
      : e.homeShare*e.homePrice+(1-e.homeShare)*e.electricPublic;
    if(motor==='Électrique')return km*e.consumptionElectric/100*electricRate;
    if(motor==='Hybride rechargeable')return km*(e.consumptionPhevPetrol/100*e.petrolPrice+e.consumptionPhevElectric/100*electricRate);
    if(motor==='Hybride'||motor==='Hybride (dérogation)')return km*e.consumptionHybrid/100*e.petrolPrice;
    if(motor==='Essence')return km*e.consumptionPetrol/100*e.petrolPrice;
    return km*e.consumptionDiesel/100*e.dieselPrice;
  };
  const share=(value)=>value==='SUEZ'?0:value==='Salarié'?1:.5; // 'Partagé' : hypothèse 50 %, modifiable ultérieurement.
  const oldCommute=energy(answers.motor,e.trip)*share(answers.commutePayer);
  const oldPrivate=energy(answers.motor,e.personal)*share(answers.privatePayer);
  const oldAen=taxable(aen1);
  const newAen=taxable(aen2);
  // Par convention de recette, le salarié finance ses kilomètres domicile-travail et privés futurs.
  const newCommute=energy(answers.futureMotor,e.trip,'futureCompany');
  const newPrivate=energy(answers.futureMotor,e.personal,'futureCompany');
  const futureInstall=answers.futureMotor==='Électrique'&&answers.home==='Installation nécessaire'&&answers.subsidy!=='Oui totalement'?e.install/e.years:0;
  const resale=e.resale==null?e.purchase*.38:e.resale;
  const depreciation=(e.purchase-resale)/e.years;
  const privateInstall=answers.persMotor==='Électrique'&&answers.home==='Installation nécessaire'?e.install/e.years:0;
  const personalCommute=energy(answers.persMotor,e.trip);
  const personalPrivate=energy(answers.persMotor,e.personal);
  const breakdowns=[
    {aen:oldAen,commute:oldCommute,privateEnergy:oldPrivate},
    {aen:newAen,commute:newCommute,privateEnergy:newPrivate,installation:futureInstall},
    {depreciation,insurance:e.insurance,maintenance:e.maintenance,other:e.annualFixed,commute:personalCommute,privateEnergy:personalPrivate,installation:privateInstall,compensation:-compNet}
  ];
  const labels=['Situation actuelle','Demain avec une voiture de fonction','Demain sans voiture de fonction'];
  const annual=breakdowns.map(items=>Object.values(items).reduce((a,b)=>a+b,0));
  return annual.map((cost,i)=>({id:i,label:labels[i],cost,gain:annual[0]-cost,breakdown:breakdowns[i]}));
}
function sensitivities(e){
  const energy=[.8,1,1.2].map(factor=>{
    const estimate={...e,homePrice:e.homePrice*factor,electricPublic:e.electricPublic*factor,dieselPrice:e.dieselPrice*factor,petrolPrice:e.petrolPrice*factor};
    return {factor,results:calculate(estimate)};
  });
  const resale=[.8,1,1.2].map(factor=>({factor,results:calculate({...e,resale:(e.resale==null?e.purchase*.38:e.resale)*factor})}));
  return {energy,resale};
}
function chartRows(results,metric){
  const values=results.map(s=>metric==='gain'?s.gain:s.cost);
  const max=Math.max(1,...values.map(v=>Math.abs(v)));
  return results.map((s,i)=>'<div class="barrow"><span>'+s.label+'</span><div class="track"><div class="fill '+(values[i]<0?'neg':'')+'" style="width:'+Math.round(100*Math.abs(values[i])/max)+'%"></div></div><b>'+fmt(values[i])+'</b></div>').join('');
}
function draw(){if(view==='home'){root.innerHTML='<article><h1>Votre véhicule, votre pouvoir d’achat</h1><p>Simulez vos trois solutions avec un questionnaire rapide, puis affinez les hypothèses.</p><p class="warn">Toutes les grilles AEN et compensation sont fictives. Les calculs fiscaux sont des approximations pour tester le parcours.</p><div class="buttons"><button onclick="start()">Commencer</button><button class="secondary" onclick="load()">Reprendre une sauvegarde</button></div></article>';return}
if(view==='wizard'){const list=active();step=Math.min(step,list.length-1);const q=list[step];const ux=uxCopy[q.id]||['Questionnaire',q.title,''];const intro=q.id==='budget'?'<section class="scenario-intro"><strong>Et si vous rendiez votre voiture de fonction SUEZ ?</strong><p>Dans ce troisième scénario, vous n’utilisez plus de véhicule fourni par SUEZ : vous achetez et entretenez votre propre voiture. Une compensation SUEZ peut éventuellement être versée selon la grille applicable. Les questions suivantes concernent uniquement cette hypothèse.</p></section>':'';root.innerHTML='<article><p class="muted">'+ux[0]+' · Question '+(step+1)+' / '+list.length+'</p><div class="progress"><div style="width:'+((step+1)/list.length*100)+'%"></div></div>'+intro+'<h2>'+ux[1]+'</h2><p class="muted" style="line-height:1.5">'+ux[2]+'</p>'+q.options.map((v,i)=>'<label class="opt"><input type="radio" name="choice" '+(answers[q.id]===v?'checked':'')+' onchange="pickIndex('+i+')">'+v+'</label>').join('')+'<div class="buttons"><button class="secondary" onclick="prev()">Précédent</button><button onclick="next()">Suivant</button></div></article>';return}
if(view==='recap'){root.innerHTML='<article><h1>Récapitulatif</h1><p>Vérifie les réponses avant le calcul.</p>'+active().map((q,i)=>'<p><span class="muted">'+q.title+'</span><br><b>'+ (answers[q.id]||'Non renseigné')+'</b> <button class="secondary" onclick="edit('+i+')">Modifier</button></p>').join('')+'<div class="buttons"><button onclick="first()">Calculer le premier bilan</button></div></article>';return}
if(view==='refine'){const d={...base,...detail};const fields=[['trip','Km domicile-travail / an'],['professional','Km professionnels / an'],['personal','Km privés / an'],['years','Durée de détention (années)'],['purchase','Prix du véhicule personnel (€)'],['resale','Revente estimée (€)'],['insurance','Assurance annuelle (€)'],['maintenance','Entretien annuel (€)'],['homeShare','Part des recharges du véhicule SUEZ à domicile (0 à 1)'],['homePrice','Prix kWh domicile (€)'],['electricPublic','Prix kWh public du véhicule personnel (€)'],['dieselPrice','Prix litre diesel (€)'],['petrolPrice','Prix litre essence (€)'],['consumptionDiesel','Consommation diesel (L/100 km)'],['consumptionPetrol','Consommation essence (L/100 km)'],['consumptionHybrid','Consommation hybride (L/100 km)'],['consumptionPhevPetrol','Conso. hybride rechargeable (L/100 km)'],['consumptionPhevElectric','Conso. hybride rechargeable (kWh/100 km)'],['consumptionElectric','Consommation électrique (kWh/100 km)'],['install','Installation (€)'],['tax','TMI (0 à 1)'],['social','Cotisations estimées (0 à 1)']];root.innerHTML='<article><h1>Affiner le bilan</h1><p>Chiffres indicatifs préremplis et modifiables. Calcul uniquement après validation.</p><form id="detail">'+fields.map(([key,label])=>'<label class="field"><span class="label">'+label+'</span><input type="number" step="any" name="'+key+'" value="'+(d[key]??Math.round(d.purchase*.38))+'"></label>').join('')+'<div class="buttons"><button type="submit">Recalculer le bilan affiné</button><button type="button" class="secondary" onclick="view=\'report\';draw()">Retour</button></div></form></article>';$('detail').onsubmit=ev=>{ev.preventDefault();detail={...Object.fromEntries(new FormData(ev.target).entries())};for(let k in detail)detail[k]=Number(detail[k]);if(!Object.values(detail).every(Number.isFinite)||detail.years<=0||detail.purchase<=0||detail.resale<0||detail.resale>detail.purchase||detail.homeShare<0||detail.homeShare>1||detail.insurance<0||detail.maintenance<0||detail.install<0||detail.homePrice<0||detail.electricPublic<0||detail.dieselPrice<0||detail.petrolPrice<0||detail.consumptionDiesel<0||detail.consumptionPetrol<0||detail.consumptionHybrid<0||detail.consumptionPhevPetrol<0||detail.consumptionPhevElectric<0||detail.consumptionElectric<0||detail.tax<0||detail.tax>1||detail.social<0||detail.social>1||detail.trip<0||detail.personal<0||detail.professional<0){alert('Vérifiez les montants et la part de recharge à domicile (0 à 100 %).');return}last=calculate({...base,...detail,kms:detail.trip+detail.personal});view='refined';draw()};return}
const res=view==='refined'?last:calculate(base);const min=Math.min(...res.map(x=>x.cost));const sensitivity=sensitivities(view==='refined'?{...base,...detail,kms:detail.trip+detail.personal}:base);root.innerHTML='<article><h1>'+(view==='refined'?'Bilan affiné':'Premier bilan estimatif')+'</h1><p class="warn">Valeurs de TEST fictives, fiscalité simplifiée non validée.</p><div class="cards">'+res.map(s=>'<div class="card">'+s.label+'<b>'+fmt(s.cost/12)+'/mois</b><span class="'+(s.gain>=0?'positive':'negative')+'">'+(s.gain>0?'+':'')+fmt(s.gain/12)+'/mois vs actuel</span></div>').join('')+'</div><h2>Coût annuel comparé</h2><table><tr><th>Solution</th><th>Annuel</th><th>Écart annuel</th></tr>'+res.map(s=>'<tr><td>'+s.label+'</td><td>'+fmt(s.cost)+'</td><td>'+fmt(s.gain)+'</td></tr>').join('')+'</table><h2>Comparaison des coûts économiques nets annuels</h2><div role="img" aria-label="Graphique de comparaison des coûts économiques annuels">'+chartRows(res,'cost')+'</div><h2>Gains ou pertes de pouvoir d’achat par rapport à la situation actuelle</h2><p class="chartnote">Un gain positif signifie une dépense inférieure à la situation actuelle. Un montant négatif représente une perte de pouvoir d’achat.</p><div role="img" aria-label="Graphique des gains et pertes annuels">'+chartRows(res,'gain')+'</div><h2>Détail des postes annuels</h2><p class="muted">Les déplacements professionnels sont pris en charge par SUEZ et ne sont pas comptabilisés dans les dépenses personnelles. Les postes fiscaux et certaines consommations sont encore des estimations.</p><table><tr><th>Poste</th><th>Situation actuelle</th><th>Avec fonction</th><th>Sans fonction</th></tr>'+[
['aen','AEN : estimation fiscale et sociale'],
['commute','Énergie domicile–travail'],
['privateEnergy','Énergie usages privés'],
['depreciation','Dépréciation du véhicule personnel'],
['insurance','Assurance'],
['maintenance','Entretien'],
['other','Autres frais'],
['installation','Installation annualisée'],
['compensation','Compensation SUEZ (déduite)']
].map(([key,label])=>'<tr><td>'+label+'</td>'+res.map(x=>'<td>'+fmt(x.breakdown[key]||0)+'</td>').join('')+'</tr>').join('')+'</table><p>Coût le plus faible selon ces hypothèses : <b>'+res.find(x=>x.cost===min).label+'</b>.</p><h2>Projection économique</h2><p>Durée : '+Math.round((view==='refined'?detail.years:base.years)*10)/10+' ans</p><div class="cards">'+res.map(s=>'<div class="card">'+s.label+'<b>'+fmt(s.cost*(view==='refined'?detail.years:base.years))+'</b></div>').join('')+'</div><h2>Analyses de sensibilité</h2><p class="muted">Hypothèses de test : énergie et valeur de revente à −20 %, référence, +20 %. Chaque ligne correspond au coût annuel net des trois situations.</p>'+[
['Prix de l’énergie',sensitivity.energy],
['Valeur de revente du véhicule personnel',sensitivity.resale]
].map(([label,items])=>'<h3>'+label+'</h3><table><tr><th>Variation</th><th>Situation actuelle</th><th>Avec fonction</th><th>Sans fonction</th></tr>'+items.map(item=>'<tr><td>'+(item.factor===1?'Référence':(item.factor<1?'−20 %':'+20 %'))+'</td>'+item.results.map(x=>'<td>'+fmt(x.cost)+'</td>').join('')+'</tr>').join('')+'</table>').join('')+'<details><summary>Hypothèses du calcul</summary><pre style="white-space:pre-wrap;overflow:auto">'+JSON.stringify(view==='refined'?{...base,...detail}:base,null,2)+'</pre></details><div class="buttons"><button onclick="view=\'refine\';draw()">Affiner mon bilan</button><button class="secondary" onclick="window.print()">Imprimer</button><button class="secondary" onclick="save()">Sauvegarder</button><button class="secondary" onclick="exportCSV()">Exporter CSV</button></div></article>';}
function start(){view='wizard';step=0;draw()}function pick(id,v){answers[id]=v;if(id==='futureMotor'&&v!=='Électrique'){delete answers.home;delete answers.install;delete answers.homeShare;delete answers.homePrice;delete answers.subsidy;}if(id==='aen')answers.aenFuture=v;if(id==='proKm')answers.energyCard=v==='Aucun'?'Non':'Oui';if(id==='home'&&v==='Impossible')answers.homeShare='0 %';draw()}
function pickIndex(i){const q=active()[step];if(!q||!q.options[i])return;pick(q.id,q.options[i])}
function prev(){step=Math.max(0,step-1);draw()}function next(){const list=active();if(!answers[list[step].id])return alert('Choisis une réponse.');if(step<list.length-1)step++;else view='recap';draw()}
function edit(i){step=i;view='wizard';draw()}function first(){if(active().some(q=>!answers[q.id]))return alert('Complète les questions restantes.');base=estimates();try{calculate(base);view='report';draw()}catch(e){alert(e.message)}}
function save(){localStorage.setItem('s3e-mobile-test',JSON.stringify({answers,step,view,base,detail,last}));alert('Simulation sauvegardée sur ce navigateur')}
function load(){let x=JSON.parse(localStorage.getItem('s3e-mobile-test')||'null');if(!x)return alert('Aucune sauvegarde');({answers,step,view,base,detail,last}=x);draw()}
function exportCSV(){const arr=view==='refined'?last:calculate(base);const data='Solution;Coût annuel EUR;Gain annuel EUR\n'+arr.map(s=>[s.label,s.cost.toFixed(2),s.gain.toFixed(2)].join(';')).join('\n');const u=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='S3E_TEST_bilan.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
draw();
</script></body></html>
