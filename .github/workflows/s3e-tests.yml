name: S3E - Contrôles qualité
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  qualite:
    name: Tests, référentiels et documentation
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt et son historique
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler le questionnaire et les calculs
        run: node tests/smoke.cjs
      - name: Contrôler les référentiels fictifs
        run: node tests/validate-referentiels.cjs
      - name: Valider les profils et les attendus de référence fictifs
        run: node tests/validate-profils.cjs
      - name: Comparer les profils au moteur et générer le rapport
        run: node tests/compare-profils.cjs
      - name: Tester le collecteur Cloudflare D1 sans déploiement
        run: npm run test:telemetry
      - name: Contrôler les documents TXT et les évolutions
        env:
          S3E_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node tests/validate-docs.cjs

      - name: Conserver le rapport des dix profils
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-profils-s3e
          path: report/recette-profils.*
          if-no-files-found: warn
          retention-days: 14

  navigateur:
    name: Parcours Chromium mobile et bureau
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright (version figée)
        run: npm install --no-package-lock
      - name: Installer Chromium et bibliothèques système
        run: npx playwright install --with-deps chromium
      - name: Exécuter les tests navigateur
        run: npm run test:browser
      - name: Conserver les artefacts en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-navigateur
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
